name: Release Build (macOS + Windows)

# 手動発火のみ (push では走らない)。Actions タブ → このワークフロー → "Run workflow" から実行する。
# version を入力すると zip 名 (Utawave-<version>-macOS-universal.zip / -Windows-x64.zip) に使われる。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン (例: 0.1.0) — zip 名に使う'
        required: true
        type: string

jobs:
  # ──────────────────────────────────────────────────────────────
  # macOS: ビルド → (証明書があれば) Developer ID 署名 + notarize → zip
  #   証明書シークレット未登録のうちは ad-hoc ビルド (未署名) のまま zip 化する。
  # ──────────────────────────────────────────────────────────────
  macos:
    runs-on: macos-14
    env:
      # secrets は if 条件で直接参照できないため job env 経由で真偽を持つ
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      # JUCE は FetchContent で取得される (build/_deps)。毎回の clone を避けるためキャッシュする。
      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.12-${{ runner.os }}-universal

      - name: Build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUTAWAVE_MAC_UNIVERSAL=ON -DUTAWAVE_CRASH_REPORT_URL="${{ vars.UTAWAVE_CRASH_REPORT_URL }}" -DUTAWAVE_ADS_ENABLED=ON -DUTAWAVE_AD_FEED_URL="https://utawave.com/ads/feed.json"
          cmake --build build --config Release --target Utawave

      - name: Locate .app
        id: app
        run: echo "path=$(find build -type d -name 'Utawave.app' | head -1)" >> "$GITHUB_OUTPUT"

      # ---- 以下 3 ステップは証明書シークレットが登録されている時だけ実行 ----
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" build.keychain
          rm -f cert.p12

      - name: Codesign (hardened runtime + entitlements)
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --timestamp --options runtime \
            --entitlements .github/macos/Utawave.entitlements \
            --sign "$MACOS_SIGN_IDENTITY" "${{ steps.app.outputs.path }}"
          codesign --verify --strict --verbose=2 "${{ steps.app.outputs.path }}"

      - name: Notarize & staple
        if: env.HAS_SIGNING == 'true'
        env:
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_APP_PASSWORD: ${{ secrets.AC_APP_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$AC_APPLE_ID" --password "$AC_APP_PASSWORD" --team-id "$AC_TEAM_ID" --wait
          xcrun stapler staple "${{ steps.app.outputs.path }}"

      # ---- zip 化 (署名の有無に関わらず) ----
      - name: Package zip
        run: |
          mkdir -p Utawave-macOS/Docs
          cp -R "${{ steps.app.outputs.path }}" Utawave-macOS/
          # 利用者がそのまま読めるよう、同梱ドキュメントはテキスト/HTML で入れる
          # (.md は配布しない。LICENSE は拡張子なしだと開けないので LICENSE.txt にする)。
          # zip 直下が散らからないよう Docs/ サブフォルダへまとめる (直下は .app のみ)
          cp THIRD_PARTY_LICENSES.txt Docs/MANUAL.html Docs/README.txt Utawave-macOS/Docs/
          cp LICENSE Utawave-macOS/Docs/LICENSE.txt
          ditto -c -k --sequesterRsrc --keepParent Utawave-macOS "Utawave-${{ inputs.version }}-macOS-universal.zip"

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: Utawave-${{ inputs.version }}-macOS-universal
          path: Utawave-${{ inputs.version }}-macOS-universal.zip

  # ──────────────────────────────────────────────────────────────
  # Windows: ビルド → 未署名 exe + PDB を artifact 化 → zip
  #   署名は Certum Open Source 証明書 (SimplySign クラウド) で行う。Certum は SignPath と違い
  #   出所検証 (Origin Verification) の縛りが無いため、ビルド済み exe をローカルで署名できる。
  #   既定は CI では未署名のまま zip 化し、リリース前にローカル (SimplySign Desktop + signtool) で
  #   署名する運用 (信頼性優先・SimplySign の TOTP 認証は完全ヘッドレス自動化が難しいため)。
  #   手順は Docs/WINDOWS_SIGNING_SETUP.md。CI 自動署名は同 doc の付録 (任意・上級) を参照。
  # ──────────────────────────────────────────────────────────────
  windows:
    # windows-latest が Visual Studio 18 2026 / CMake 4.x に更新され、JUCE FetchContent の
    # サブビルドがジェネレータ不整合で configure 失敗するため、安定版 (VS 2022) に固定する。
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      # ASIO SDK の deploy key 未登録なら取得をスキップ (= WASAPI/DirectSound のみ・fork 安全)
      HAS_ASIO: ${{ secrets.ASIOSDK_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # JUCE は FetchContent で取得される (build/_deps)。毎回の clone を避けるためキャッシュする。
      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.12-${{ runner.os }}

      # ── ASIO SDK を非公開 repo (utawave-asiosdk) から read-only deploy key で取得 ──
      # 再配布制限のため public repo には置かない。配置されると CMake が
      # Source/ThirdParty/asiosdk/common/iasiodrv.h を検出して JUCE_ASIO=1 を自動有効化する。
      # deploy key 未登録 (fork 等) では skip し、WASAPI/DirectSound のみでビルドする。
      - name: Fetch ASIO SDK (private repo)
        if: env.HAS_ASIO == 'true'
        shell: bash
        env:
          ASIOSDK_DEPLOY_KEY: ${{ secrets.ASIOSDK_DEPLOY_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$ASIOSDK_DEPLOY_KEY" > "$HOME/.ssh/asio_key"
          chmod 600 "$HOME/.ssh/asio_key"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/asio_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:AsteroidApp-hub/utawave-asiosdk.git Source/ThirdParty/asiosdk
          rm -f "$HOME/.ssh/asio_key"
          rm -rf Source/ThirdParty/asiosdk/.git
          test -f Source/ThirdParty/asiosdk/common/iasiodrv.h \
            && echo "ASIO SDK ready (JUCE_ASIO will be enabled)" \
            || { echo "ASIO SDK missing iasiodrv.h"; exit 1; }

      - name: Build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUTAWAVE_CRASH_REPORT_URL="${{ vars.UTAWAVE_CRASH_REPORT_URL }}" -DUTAWAVE_ADS_ENABLED=ON -DUTAWAVE_AD_FEED_URL="https://utawave.com/ads/feed.json"
          cmake --build build --config Release --target Utawave

      - name: Stage unsigned exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter Utawave.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName artifact/Utawave.exe

      - name: Upload unsigned exe (signing input)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: utawave-unsigned
          path: artifact/Utawave.exe

      # PDB を保管 (クラッシュレポートの「Utawave.exe + 0x<RVA>」を関数/行へ解決するのに必要)。
      # 配布 zip には入れず、別 artifact として上げる。リリースごとに DL して手元へ永久保管すること
      #   (RVA はビルドごとに変わるため、その版の PDB が無いと後からスタックトレースを解決できない)。
      # 署名は RVA を変えないので、未署名 exe と PDB のペアで解決できる。手順は Docs/CRASH_REPORT_SETUP.md。
      - name: Stage PDB (symbols)
        shell: pwsh
        run: |
          $pdb = Get-ChildItem -Path build -Recurse -Filter Utawave.pdb | Select-Object -First 1
          if ($null -eq $pdb) { Write-Host "::error::Utawave.pdb が見つかりません (Release で /Zi /DEBUG が付いているか CMakeLists を確認)"; exit 1 }
          New-Item -ItemType Directory -Force -Path symbols | Out-Null
          Copy-Item $pdb.FullName symbols/
          Copy-Item artifact/Utawave.exe symbols/   # exe + PDB をペアで (RVA 解決用)

      - name: Upload PDB (symbols, not distributed)
        uses: actions/upload-artifact@v4
        with:
          name: Utawave-${{ inputs.version }}-Windows-x64-pdb
          path: symbols/
          retention-days: 90

      # 署名は CI では行わない (Certum SimplySign はローカル署名運用)。リリース前に
      # Docs/WINDOWS_SIGNING_SETUP.md の手順で artifact の Utawave.exe をローカル署名し、
      # zip を作り直して配布する。下の Package zip は未署名でも緑になる (パイプライン検証用)。
      # ※ 将来 CI 自動署名を入れる場合は、ここで signed/Utawave.exe を生成すれば下の zip 化が拾う。
      - name: Package zip
        shell: pwsh
        run: |
          # 署名済み (signed/) があればそれを、無ければ未署名 exe を使う
          $src = if (Test-Path signed/Utawave.exe) { 'signed/Utawave.exe' } else { 'artifact/Utawave.exe' }
          New-Item -ItemType Directory -Force -Path Utawave-Windows/Docs | Out-Null
          Copy-Item $src Utawave-Windows/Utawave.exe
          # 利用者がそのまま読めるよう、同梱ドキュメントはテキスト/HTML で入れる
          # (.md は配布しない。LICENSE は拡張子なしだと開けないので LICENSE.txt にする)。
          # 多言語 help でファイル数が多く直下が散らかるため Docs/ サブフォルダへまとめる
          # (直下は Utawave.exe のみ)。アプリの「使い方ドキュメント」は exe 隣の Docs/ を先に探す
          Copy-Item THIRD_PARTY_LICENSES.txt,Docs/MANUAL.html,Docs/README.txt Utawave-Windows/Docs/
          Copy-Item LICENSE Utawave-Windows/Docs/LICENSE.txt
          # 言語別ヘルプを全て同梱する
          # (help.html=ja / help.en.html / help.zh-Hans.html / help.zh-Hant.html / help.ko.html)
          Copy-Item Docs/help*.html Utawave-Windows/Docs/
          Compress-Archive -Path Utawave-Windows -DestinationPath "Utawave-${{ inputs.version }}-Windows-x64.zip" -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: Utawave-${{ inputs.version }}-Windows-x64
          path: Utawave-${{ inputs.version }}-Windows-x64.zip

      # ── インストーラ (Inno Setup) ──
      # デスクトップ/スタートのショートカット + .uta 関連付け + アンインストーラを提供する
      # インストーラ形式も配布する (非技術者向けの UX 向上)。zip 版も併存。
      # CI では未署名 (artifact/ の exe) でコンパイルする。署名運用は Docs/WINDOWS_SIGNING_SETUP.md。
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Host "::error::ISCC.exe が見つかりません (Inno Setup のインストールを確認)"; exit 1 }
          New-Item -ItemType Directory -Force -Path installer_out | Out-Null
          # SrcDir 既定は ..\artifact (= repo\artifact、Utawave.exe が staged 済み)
          & $iscc "/DAppVersion=${{ inputs.version }}" "/Oinstaller_out" installer\Utawave.iss
          $setup = Get-ChildItem -Path installer_out -Filter *.exe | Select-Object -First 1
          if ($null -eq $setup) { Write-Host "::error::Setup.exe が生成されませんでした"; exit 1 }
          Write-Host "built installer: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Utawave-${{ inputs.version }}-Windows-Setup
          path: installer_out/*.exe
