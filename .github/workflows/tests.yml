name: Tests

# push / PR のたびに UtawaveTests (ユニットテスト + 書き出し結果の比較テスト) を回す。
#   - macOS: ASan + UBSan (メモリ破壊・UAF・未定義動作をその場で検出)
#   - macOS: TSan (audio thread / 先読み / ワーカー間のデータ競合を検出)
#   - Windows: 通常の Debug ビルド (MSVC でのコンパイル確認 + 環境差の検出)
# 配布ビルド (release-build.yml) とは独立。署名シークレットは使わない。
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'Docs/**', 'installer/**' ]
  pull_request:
    paths-ignore: [ '**.md', 'Docs/**', 'installer/**' ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-asan:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # macOS の LSan は非対応。UBSan はスタックトレース付きで即停止 (-fno-sanitize-recover)
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      UTAWAVE_RENDER_OUT: ${{ github.workspace }}/render-out
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.5-${{ runner.os }}-tests

      - name: Configure (Debug + ASan/UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DUTAWAVE_SANITIZE=address,undefined

      - name: Build UtawaveTests
        run: cmake --build build --target UtawaveTests -j 4

      - name: Run UtawaveTests
        run: |
          T=$(find build -type f -perm -u+x -name UtawaveTests | head -1)
          "$T"

      - name: Upload failed render artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-golden-actual-macos
          path: render-out/
          if-no-files-found: ignore

  macos-tsan:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      UTAWAVE_RENDER_OUT: ${{ github.workspace }}/render-out
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.5-${{ runner.os }}-tests

      - name: Configure (Debug + TSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DUTAWAVE_SANITIZE=thread

      - name: Build UtawaveTests
        run: cmake --build build --target UtawaveTests -j 4

      - name: Run UtawaveTests
        run: |
          T=$(find build -type f -perm -u+x -name UtawaveTests | head -1)
          "$T"

  windows:
    # release-build.yml と同じ理由で VS 2022 に固定 (windows-latest は JUCE FetchContent と相性が悪い)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      UTAWAVE_RENDER_OUT: ${{ github.workspace }}\render-out
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.5-${{ runner.os }}-tests

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build UtawaveTests (Debug)
        run: cmake --build build --target UtawaveTests --config Debug -- /m

      - name: Run UtawaveTests
        shell: pwsh
        run: |
          & "build\UtawaveTests_artefacts\Debug\UtawaveTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload failed render artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-golden-actual-windows
          path: render-out/
          if-no-files-found: ignore
